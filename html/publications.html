<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Header and footer come from js/layout.js -->
<header class="topbar" id="site-header"></header>
<script src="../js/layout.js"></script>

<main>
  <section class="block">
    <div class="wrap">
      <h1>Publications</h1>
      <p class="intro">Papers by the lab's faculty and students. The faculty pages of
        <a href="https://www.csa.iisc.ac.in/~deepakd/papers/index-cron.html">Deepak D'Souza</a> and
        <a href="https://www.csa.iisc.ac.in/~raghavan/pubs.html">Komondoor V. Raghavan</a> also list theses and reports.</p>

      <div class="tabs" role="tablist" aria-label="Arrange publications">
        <button type="button" role="tab" id="tab-year" aria-controls="by-year" aria-selected="true">By year</button>
        <button type="button" role="tab" id="tab-topic" aria-controls="by-topic" aria-selected="false" tabindex="-1">By topic</button>
      </div>

      <ol class="papers" id="by-year" role="tabpanel" aria-labelledby="tab-year"></ol>
      <div class="by-topic" id="by-topic" role="tabpanel" aria-labelledby="tab-topic" hidden></div>
    </div>
  </section>
</main>

<footer class="footer" id="site-footer"></footer>
